<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SmartCoffee</title>
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>SmartCoffee</h1>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#sobre">Sobre</a>
            <a href="#produtos">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <!-- Início -->
    <section id="inicio">
        <p>Sabores que conectam</p>
        <h2>CAFÉ QUE CONECTA AS PESSOAS</h2>
        <p>Mais que café, uma experiência</p>

        <button>Ver cardápio</button>

        <img src="#" alt="Imagem do café">
    </section>

    <!-- Sobre -->
    <section id="sobre">
        <p>Quem nós somos</p>
        <h2>Sobre Nós</h2>

        <button>Saiba mais</button>

        <img src="#" alt="Imagem sobre nós">
    </section>

    <!-- Produtos -->
    <section id="produtos">
        <h2>Nossos cafés</h2>

        <article>
            <img src="#" alt="Café 1">
            <h3>Café 1</h3>
        </article>

        <article>
            <img src="#" alt="Café 2">
            <h3>Café 2</h3>
        </article>

        <article>
            <img src="#" alt="Café 3">
            <h3>Café 3</h3>
        </article>
    </section>

    <!-- Ambiente -->
    <section>
        <img src="#" alt="Nosso ambiente">

        <h2>Nosso ambiente</h2>

        <button>Conheça</button>
    </section>

    <!-- Contato -->
    <section id="contato">
        <p>Contato</p>
        <h2>Fale com a gente</h2>

        <form>
            <input type="text" placeholder="Nome">
            <input type="email" placeholder="E-Mail">
            <input type="text" placeholder="Mensagem">

            <button>Enviar Mensagem</button>
        </form>
    </section>

    <!-- Rodapé -->
    <footer>
        <h2>SmartCoffee</h2>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#sobre">Sobre</a>
            <a href="#produtos">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </footer>

</body>

</html>
